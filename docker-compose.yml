services:
  # ═══════════════════════════════════════════════════════════
  #                    ARAŞTIRMA AJANI API
  # ═══════════════════════════════════════════════════════════
  api:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: arastirma_ajani_api
    ports:
      - "8000:8000"
    env_file:
      - .env
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8000/saglik" ]
      interval: 30s
      timeout: 10s
      retries: 3

  # ═══════════════════════════════════════════════════════════
  #                    ARAŞTIRMA AJANI ARAYÜZ (Streamlit)
  # ═══════════════════════════════════════════════════════════
  streamlit:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: arastirma_ajani_ui
    ports:
      - "8501:8501"
    env_file:
      - .env
    restart: unless-stopped
    depends_on:
      - api
